name: CI

on:
  push:
    branches:
      - dev
      - staging
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Build app
        run: npm run build

      - name: Build Docker image
        run: docker build .
