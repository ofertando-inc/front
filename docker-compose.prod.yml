services:
  front:
    image: ghcr.io/ofertando-inc/front:prod
    container_name: front-ofertando-prod
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5173}:${PORT:-3000}'
    networks:
      - dokploy-network
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT:-3000}
      BACK_URL: ${BACK_URL}

networks:
  dokploy-network:
    external: true
